[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-knowledge"
version = "0.1.0"
description = "Turn YouTube videos into thoroughly analyzed, connected Obsidian notes."
readme = "README.md"
requires-python = ">=3.12"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
dependencies = [
    "yt-dlp[default,curl-cffi]>=2025.11.12",
    "deno>=2.3.0,<3",
    "imageio-ffmpeg>=0.6.0",
    "faster-whisper>=1.1.0",
    "numpy>=1.26",
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "markdown-it-py>=4.0,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
yk = "youtube_knowledge.cli:main"

[tool.setuptools.packages.find]
include = ["youtube_knowledge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
